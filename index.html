<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hykfft</title>
  <meta name="description" content="hykfft 个人站点" />
  <link rel="canonical" href="https://hykfft.dpdns.org/" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100%; background: #f8f9fa; color: #212529;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 1rem; line-height: 1.6; padding: 1.5rem;
    }
    main { max-width: 480px; width: 100%; text-align: center; }
    h1 { font-size: 2rem; font-weight: 700; letter-spacing: 0.04em; color: #111; margin-bottom: 1.5rem; }
    .nav-links { list-style: none; display: flex; flex-direction: column; gap: 0.75rem; }
    .nav-links a {
      display: block; padding: 0.75rem 1.25rem;
      background: #fff; border: 1px solid #dee2e6; border-radius: 8px;
      color: #343a40; text-decoration: none; font-size: 1rem; font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-links a:hover { background: #e9ecef; border-color: #adb5bd; }
    .nav-links .sub { font-size: 0.82rem; color: #6c757d; font-weight: 400; display: block; margin-top: 2px; }
    #redirect-msg { margin-top: 1.5rem; font-size: 0.85rem; color: #6c757d; display: none; }
  </style>
  <script>
    // Legacy compatibility: redirect map deep links (with known query params) to /landscape/
    (function () {
      var q = window.location.search;
      var h = window.location.hash;
      if (q) {
        var MAP_PARAMS = ['year','person','place','event','quiz','lang','embed','zoom','center','hover','polity','stop','trace','lock','autoplay','from','to'];
        var hasMapParam = MAP_PARAMS.some(function(k) {
          return q.indexOf(k + '=') >= 0 || q.indexOf('?' + k) >= 0;
        });
        if (hasMapParam) {
          window.location.replace('/landscape/' + q + h);
        }
      }
    })();
  </script>
</head>
<body>
  <main>
    <h1>hykfft</h1>
    <ul class="nav-links">
      <li>
        <a href="/landscape/">
          江山时序 · 历史地图
          <span class="sub">中国历史交互舆图（战国 → 今）</span>
        </a>
      </li>
    </ul>
    <p id="redirect-msg">正在跳转至地图…</p>
  </main>
</body>
</html>

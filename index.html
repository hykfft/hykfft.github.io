<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hykfft</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      background-color: #f8f9fa;
      color: #212529;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei",
                   sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      padding: 1.5rem;
    }

    main {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #111;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.05rem;
      color: #555;
    }
  </style>
</head>
<body>
  <main>
    <h1>hykfft</h1>
    <p>网站已上线，内容持续更新中。</p>

</html>
